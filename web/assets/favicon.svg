  <g stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity="0.85">
    <path d="M32 33 15 16M32 33 50 14M32 33 53 40M32 33 33 53M32 33 12 44"/>
    <path d="M50 14 53 40M33 53 12 44" opacity="0.6"/>
  </g>
  <g fill="#fff">
    <circle cx="15" cy="16" r="5.5"/>
    <circle cx="50" cy="14" r="5.5"/>
    <circle cx="53" cy="40" r="5.5"/>
    <circle cx="33" cy="53" r="5.5"/>
    <circle cx="12" cy="44" r="5.5"/>
    <circle cx="32" cy="33" r="9"/>
  </g>
  <circle cx="32" cy="33" r="4.6" fill="#ff6a33"/>
